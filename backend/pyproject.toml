[project]
name = "geotile-label-backend"
version = "1.4.0"
description = "GeoTile Label — satellite scene labeling & ML dataset generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "rasterio>=1.3",
    "sse-starlette>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "psutil>=5.9",
    "usearch>=2.23,<3",
]

[project.optional-dependencies]
# UWAGA LICENCYJNA: `ultralytics` jest na AGPL-3.0 i jest zaleznoscia RDZENIA (trening,
# predykcja, eksport YOLO, rejestr modeli) — mimo ze technicznie siedzi w extrasie.
yolo = [
    "torch",
    "torchvision",
    "ultralytics>=8.0",
]

# SAM3: enkoder tekstu (fork CLIP) + backbone obrazowy. Bez nich ultralytics probuje
# doinstalowac je z sieci w trakcie uzycia, co offline konczy sie zawisem albo mylacym
# komunikatem o bledzie sieci. Build desktopowy instaluje je zawsze.
sam3 = [
    "ftfy",
    "regex",
    "timm",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

# Zaleznosci deweloperskie. 37 z 76 plikow testowych backendu importuje `pytest`, a
# runtime pakowany z aplikacja go nie zawiera — bez tego extrasa zestaw testow jest
# nieuruchamialny, mimo ze jest kompletny.
#     pip install -e ".[dev]"
#     python -m pytest backend/tests
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
